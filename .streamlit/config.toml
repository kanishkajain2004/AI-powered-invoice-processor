[theme]
base = "light"
primaryColor = "#256abf"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans-serif"

[server]
maxUploadSize = 20  # MB; keep equal to the backend's MAX_UPLOAD_MB

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
